# agent.log is append only from bin/run-agent.sh and was 1.1MB after two weeks
# with nothing pruning it. copytruncate because the wrapper appends with >> and
# never reopens the file, so a plain rotate would leave it writing to the
# rotated inode. Safe to rotate now that status reads state/runs/ rather than
# recovering last run times by parsing this file.
/root/marketing-agents/state/agent.log {
    weekly
    rotate 6
    size 20M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
